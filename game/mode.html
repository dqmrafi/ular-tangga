<!DOCTYPE html>
<html lang="id" class="stage16"><head><script src="assets/js/frame-guard.js"></script><script src="assets/js/boot-guard.js"></script><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pilih Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/scene-bg.css"><script src="assets/js/scene-bg.js" data-auto data-preset="soft"></script>

<style>:root{--curbar-right:7.8rem;--curbar-top:1.9rem;--cur-fs:1.9rem;--cur-icon:5.4rem}</style><link rel="stylesheet" href="assets/css/shared-ui.css?v=icons1"><script src="assets/js/landscape.js"></script><style>
:root{--bk:max(5rem,44px)}
:root{--bd:#12337f;--ink:#0b1530;--cur-minw:10.5rem;--cur-gap:1rem;--cur-h:3.8rem;--cur-icon:4.2rem;--cur-fs:1.9rem}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Arial Rounded MT Bold',Arial,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#5db4f5,#a9dcf8 60%,#d5f0ff)}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .15s,filter .15s}
button:active:not(:disabled){transform:scale(.95)}button:focus-visible,.map:focus-visible{outline:.3rem solid #fff}
#sky{position:fixed;inset:0}
#stage{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column;gap:1.2rem}
.blue{background:linear-gradient(#3f93f4,#1d58c6);border-radius:1rem;box-shadow:0 0 0 .22rem var(--ink),0 .5rem 0 .22rem var(--ink),inset 0 .2rem .2rem rgba(255,255,255,.55),inset 0 0 0 .25rem rgba(150,205,255,.45)}
#hd{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;padding:1.6rem 2.4rem 0;height:7.4rem}
.ib{width:max(5rem,44px);height:max(5rem,44px);padding:0;display:grid;place-items:center}.ib img,.ib svg{width:3.2rem;height:3.2rem;pointer-events:none}
#title{position:absolute;left:46%;top:1.7rem;translate:-50% 0;height:5rem;padding:0 2.4rem;display:flex;align-items:center;gap:1.2rem;font-size:3.2rem;white-space:nowrap;-webkit-text-stroke:.2rem var(--ink);paint-order:stroke fill;text-shadow:0 .2rem 0 var(--ink)}
#title img{width:3.8rem;height:3.8rem}
.ut-curbar{position:absolute;right:8.8rem;top:2.2rem}
/* ===== select map: horizontal carousel, scroll-snap ===== */
#mapsec{flex:none;position:relative;margin-top:.8rem}
#car{display:flex;gap:2rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;padding:1.6rem 0 1.8rem;-webkit-overflow-scrolling:touch}
#car::-webkit-scrollbar{display:none}
.sp{flex:none;width:calc(50% - 15rem - 1rem)}
.map{flex:none;scroll-snap-align:center;position:relative;width:30rem;height:13rem;border-radius:1.4rem;overflow:hidden;cursor:pointer;opacity:.72;scale:.88;transition:scale .25s,opacity .25s,box-shadow .25s;box-shadow:0 0 0 .3rem var(--ink)}
.map.on{opacity:1;scale:1;box-shadow:0 0 0 .3rem var(--ink),0 0 0 .75rem #ffd73a,0 0 2.6rem 1rem rgba(255,225,70,.6)}
.map .art{position:absolute;inset:0}.map .art>*{width:100%;height:100%;display:block}
.map b{position:absolute;left:50%;bottom:.8rem;translate:-50% 0;padding:.1rem 2.2rem;border-radius:.9rem;font-size:2.4rem;white-space:nowrap;background:linear-gradient(#ffc86a,#e48a20);box-shadow:0 0 0 .2rem var(--ink);-webkit-text-stroke:.3rem var(--ink);paint-order:stroke fill}
.arr{position:absolute;top:50%;translate:0 -60%;z-index:3;width:4.4rem;height:6.4rem;padding:0;font-size:3.6rem;line-height:1}
#prev{left:1.6rem}#next{right:1.6rem}
#dots{display:flex;justify-content:center;gap:.9rem;margin-top:-.4rem;height:1.4rem}
#dots i{width:1.2rem;height:1.2rem;border-radius:50%;background:rgba(11,21,48,.35);cursor:pointer;transition:.2s}#dots i.on{background:#ffd73a;width:3rem;border-radius:.7rem}
/* ===== dua card besar (tidak flip) ===== */
#cards{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.5fr;gap:2.4rem;padding:0 4.6rem 2rem}
.card{position:relative;min-height:0;display:flex;flex-direction:column;padding:1.2rem 1.6rem 1.6rem;border-radius:1.6rem;background:linear-gradient(var(--p1),var(--p2));box-shadow:0 0 0 .3rem #0b0c10,0 .7rem 0 .3rem #0b0c10,inset 0 0 0 .38rem var(--c)}
#qs{--p1:#4a2b8c;--p2:#35205f;--c:#8a6ad8}#cr{--p1:#2f6a3c;--p2:#25472d;--c:#47b866}
.card h2{margin:0;font-size:3.4rem;line-height:1;-webkit-text-stroke:.5rem #0b0c10;paint-order:stroke fill;text-shadow:0 .3rem 0 #0b0c10}
.card>p{margin:.3rem 0 1rem;font-size:1.5rem;font-weight:700;color:#e5ecf8}
.tiles{flex:1;min-height:0;display:grid;gap:1.4rem;grid-auto-flow:column;grid-auto-columns:1fr}
/* tile kecil = yang flip */
.tile{position:relative;min-height:0;perspective:90rem}
.ti{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.2,.5,1)}
.tile.flipped .ti{transform:rotateY(180deg)}
.fc,.bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:1.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;padding:.8rem;text-align:center;box-shadow:0 0 0 .2rem #0b0c10,0 .4rem 0 .2rem #0b0c10,inset 0 .2rem .2rem rgba(255,255,255,.45)}
.fc{width:100%}
.tile.flipped .fc{pointer-events:none}.tile:not(.flipped) .bk{pointer-events:none}
.bk{transform:rotateY(180deg);justify-content:flex-start;gap:.6rem}
.tc1 .fc,.tc1 .bk{background:linear-gradient(#ffd24d,#ff9a1f);text-shadow:0 .1rem 0 #8a4a0a}
.tc2 .fc,.tc2 .bk{background:linear-gradient(#58b6ff,#1f86ee);text-shadow:0 .1rem 0 rgba(10,40,120,.6)}
.tc3 .fc,.tc3 .bk{background:linear-gradient(#4fd24a,#27992a);text-shadow:0 .15rem 0 #0e4a12}
.fc>b{font-size:2.3rem;line-height:1;-webkit-text-stroke:.35rem #0b0c10;paint-order:stroke fill;text-shadow:none}
.fc>small{font-size:1.25rem;font-weight:700;line-height:1.15;opacity:.95}
.fc svg{width:5rem;height:5rem}
.bh{flex:none;width:100%;display:flex;align-items:center;justify-content:space-between;font-size:1.5rem}
.bh button{width:3.4rem;height:3.4rem;border-radius:.8rem;background:rgba(11,21,48,.4);padding:0;font-size:1.8rem}
.bk .opt{flex:1;min-height:3.4rem;width:100%;max-height:5.4rem;border-radius:.9rem;font-size:1.7rem;line-height:1.05;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 .2rem rgba(255,255,255,.4)}
.bk .opt:hover{background:rgba(255,255,255,.45)}
#mm{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.55);backdrop-filter:blur(6px);z-index:50}
#mm.show{display:grid}
.mbox{width:min(46rem,90vw);padding:2.4rem;text-align:center;border-radius:2rem}
.mbox h3{margin:0 0 .6rem;font-size:3rem;text-shadow:0 .2rem 0 var(--bd)}.mbox p{margin:0 0 1.4rem;font-size:1.8rem;color:#e8f5ff}
.spin{width:6rem;height:6rem;margin:0 auto 1.2rem;border-radius:1rem;background:#ffd73a;animation:sp 1s linear infinite;box-shadow:0 0 0 .3rem var(--ink)}.spin.done{animation:none;background:#4fd24a}
@keyframes sp{to{rotate:360deg}}
.cx{height:4.4rem;padding:0 3rem;border-radius:1rem;background:linear-gradient(#ff6a6a,#d63a3a);font-size:2rem;box-shadow:0 0 0 .2rem var(--ink)}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:2rem;opacity:0;transition:.3s;z-index:60;pointer-events:none}#toast.on{opacity:1;translate:-50% 0}
@media(max-aspect-ratio:1/1){
html{font-size:2.6vw}html,body{overflow:auto}
#stage{position:relative;inset:auto;min-height:100%}
#cards{grid-template-columns:1fr;padding:0 1.6rem 2.4rem;gap:2rem}.card{height:34rem}
.map{width:34rem;height:15rem}.sp{width:calc(50% - 17rem - 1rem)}
#prev{left:.4rem}#next{right:.4rem}.ut-curbar{display:none}#title{font-size:2.8rem;padding:0 2rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<div id="sky"></div>
<div id="stage">
 <header id="hd">
  <button class="blue ib" id="back" aria-label="Kembali"><img src="assets/Images/icon/ui/back.webp" alt="" draggable="false"></button>
  <div class="blue" id="title"><img src="assets/Images/icon/mode/console.webp" alt="" draggable="false">Pilih Mode</div>
  <div class="ut-curbar"><div class="ab cur" id="gem"><img class="ci" src="assets/Images/icon/currency/emerald.webp" alt="" draggable="false"><span id="gemV"></span></div><div class="ab cur" id="coin"><img class="ci" src="assets/Images/icon/currency/coin.webp" alt="" draggable="false"><span id="coinV"></span></div></div>
  <button class="blue ib" id="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#fff" stroke="#0b1530" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
 </header>
 <section id="mapsec" aria-label="Pilih map">
  <button class="blue arr" id="prev" aria-label="Map sebelumnya">‹</button>
  <div id="car" role="listbox" aria-label="Daftar map"></div>
  <button class="blue arr" id="next" aria-label="Map berikutnya">›</button>
  <div id="dots"></div>
 </section>
 <section id="cards">
  <article class="card" id="qs"><h2>QUICK START</h2><p>Main cepat lewat matchmaking.</p><div class="tiles" id="qsT"></div></article>
  <article class="card" id="cr"><h2>CREATE ROOM</h2><p>Buat pertandingan dengan pengaturan sendiri.</p><div class="tiles" id="crT"></div></article>
 </section>
</div>
<div id="mm"><div class="mbox blue" role="dialog" aria-modal="true"><div class="spin" id="mmSpin"></div><h3 id="mmT">MENCARI LAWAN...</h3><p id="mmP"></p><button class="cx" id="mmX">BATAL</button></div></div>
<div id="toast"></div>
<script src="assets/js/item-catalog.js"></script>
<script src="assets/js/item-art.js"></script>
<script src="assets/js/character-data.js"></script>
<script src="assets/js/player-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="hud/ui-core.js"></script>
<script src="assets/js/room-flow.js"></script>
<script>UT.App.init({page:'mode'});</script>
<script>
(()=>{
const $=s=>document.querySelector(s),PD=window.PlayerData,IC=window.ItemCatalog,RF=UT.RoomFlow,fmt=n=>n.toLocaleString('id-ID');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800)}
const buzz=()=>{try{if(PD.settings().vibration&&navigator.vibrate)navigator.vibrate(15)}catch(e){}};
function money(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
UT.Events.on('currencyChanged',money);money();
/* sky ringan */
(()=>{const sk=$('#sky');[[8,10,14],[40,6,10],[78,12,16],[66,70,14],[16,76,12]].forEach(p=>{const e=document.createElement('div');e.style.cssText=`position:absolute;left:${p[0]}%;top:${p[1]}%;width:${p[2]}rem;height:${p[2]/3}rem;border-radius:50%;background:#fff;opacity:.7;filter:blur(.6rem)`;sk.appendChild(e)})})();

/* ---------- MAP CAROUSEL (CSS scroll-snap) ---------- */
const MAPS=RF.maps();let idx=Math.max(0,MAPS.indexOf(RF.getMap()));
const car=$('#car');
car.innerHTML='<div class="sp"></div>'+MAPS.map((m,i)=>`<div class="map" role="option" tabindex="0" data-i="${i}" aria-selected="false"><div class="art">${ItemArt.theme(m.id)}</div><b>${m.name.replace(/^Map /,'')}</b></div>`).join('')+'<div class="sp"></div>';
$('#dots').innerHTML=MAPS.map((_,i)=>`<i data-i="${i}"></i>`).join('');
function setActive(i){idx=i;RF.setMap(MAPS[i].gameKey);car.querySelectorAll('.map').forEach((e,k)=>{e.classList.toggle('on',k===i);e.setAttribute('aria-selected',k===i)});$('#dots').querySelectorAll('i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function center(i,beh){i=Math.max(0,Math.min(MAPS.length-1,i));const el=car.children[i+1];if(!el||!car.clientWidth)return;car.scrollTo({left:el.offsetLeft+el.offsetWidth/2-car.clientWidth/2,behavior:reduce?'auto':(beh||'smooth')});setActive(i)}
car.querySelectorAll('.map').forEach(e=>{e.onclick=()=>center(+e.dataset.i);e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();center(+e.dataset.i)}}});
$('#dots').querySelectorAll('i').forEach(d=>d.onclick=()=>center(+d.dataset.i));
$('#prev').onclick=()=>center(idx-1);$('#next').onclick=()=>center(idx+1);
let raf=0;car.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{const mid=car.scrollLeft+car.clientWidth/2;let b=0,bd=1e9;MAPS.forEach((_,i)=>{const el=car.children[i+1],d=Math.abs(el.offsetLeft+el.offsetWidth/2-mid);if(d<bd){bd=d;b=i}});if(b!==idx)setActive(b)})},{passive:true});
addEventListener('resize',()=>center(idx,'auto'));
if(MAPS.length){setActive(idx);requestAnimationFrame(()=>center(idx,'auto'))}

/* ---------- TILE (yang flip hanya tile kecil; hanya satu terbuka) ---------- */
const IC_={solo:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7z" fill="#fff"/></svg>',
team:'<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3.4" fill="#fff"/><circle cx="17" cy="8" r="3.4" fill="#ffe36a"/><path d="M1 20c0-4 3-6 7-6s7 2 7 6zM12 20c0-3 2-5 5-5s6 2 6 5z" fill="#fff"/></svg>',
bot:'<img src="assets/Images/icon/mode/robot.webp" alt="" draggable="false" style="width:5rem;height:5rem">',
loc:'<img src="assets/Images/icon/mode/kontak.webp" alt="" draggable="false" style="width:5rem;height:5rem">',
room:'<img src="assets/Images/icon/lobby/mail.webp" alt="" draggable="false" style="width:5rem;height:5rem">'};
const TILES={
 qs:[{id:'solo',c:'tc1',ic:'solo',t:'SOLO',d:'Ranked 2 / 3 / 4 pemain',flip:{h:'JUMLAH PEMAIN',o:[['2 PEMAIN',()=>ranked('solo',2)],['3 PEMAIN',()=>ranked('solo',3)],['4 PEMAIN',()=>ranked('solo',4)]]}},
     {id:'team',c:'tc2',ic:'team',t:'TEAM',d:'2 vs 2 • langsung cari tim',go:()=>ranked('team',4)}],
 cr:[{id:'vsc',c:'tc2',ic:'bot',t:'VS COMPUTER',d:'Lawan AI',flip:{h:'JUMLAH PESERTA',o:[2,3,4].map(n=>[n+' PESERTA',()=>room('vsc','solo',n)])}},
     {id:'local',c:'tc1',ic:'loc',t:'MULTI PLAYER',d:'Satu perangkat, gantian',flip:{h:'JUMLAH PEMAIN',o:[2,3,4].map(n=>[n+' PEMAIN',()=>room('local','solo',n)])}},
     {id:'online',c:'tc3',ic:'room',t:'CREATE ROOM',d:'Online + undang teman',flip:{h:'FORMAT ROOM',o:[['TEAM',()=>room('online','team',4)],['SOLO',()=>room('online','solo',4)]]}}]};
Object.keys(TILES).forEach(k=>{$('#'+k+'T').innerHTML=TILES[k].map(t=>`<div class="tile ${t.c}" id="t_${t.id}"><div class="ti">
 <button class="fc" data-t="${t.id}" aria-label="${t.t}">${IC_[t.ic]}<b>${t.t}</b><small>${t.d}</small></button>
 <div class="bk">${t.flip?`<div class="bh"><span>${t.flip.h}</span><button data-x aria-label="Tutup">↩</button></div>`+t.flip.o.map((o,i)=>`<button class="opt" data-o="${i}">${o[0]}</button>`).join(''):''}</div></div></div>`).join('')});
const ALL=[...TILES.qs,...TILES.cr];
function closeAll(){document.querySelectorAll('.tile.flipped').forEach(t=>t.classList.remove('flipped'))}
ALL.forEach(t=>{const el=$('#t_'+t.id);
 el.querySelector('.fc').onclick=()=>{buzz();if(t.go){closeAll();t.go();return}const was=el.classList.contains('flipped');closeAll();if(!was)el.classList.add('flipped')};
 el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{buzz();t.flip.o[+b.dataset.o][1]()});
 const x=el.querySelector('[data-x]');if(x)x.onclick=closeAll});
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
addEventListener('pageshow',()=>{closeAll();cancelMM()});

/* ---------- alur ---------- */
function room(mode,format,count){RF.navigate('room',{mode,format,count})}
let mm=null,tm=[];
function cancelMM(){mm=null;tm.forEach(clearTimeout);tm=[];$('#mm').classList.remove('show')}
/* SIMULASI: ganti dengan layanan matchmaking realtime (WebSocket) */
function ranked(format,n){
 const map=RF.getMap(),cfg={type:'ranked',mode:'online',format,privacy:'public',host:true,count:n,
  players:Array.from({length:n},(_,i)=>({name:i?'Lawan '+i:(PD.profile().name||'Kamu'),team:format==='team'?(i<2?1:2):0,kind:i?'friend':'host'})),
  skin:(IC.byId(PD.equippedId('skin'))||{}).gameKey,dice:(IC.byId(PD.equippedId('dice'))||{}).gameKey,map:map&&map.gameKey};
 mm=cfg;$('#mmSpin').classList.remove('done');$('#mmT').textContent='MENCARI LAWAN...';
 $('#mmP').textContent='Ranked • '+(format==='team'?'Team 2 vs 2':'Solo '+n+' pemain')+' • '+(map?map.name:'');$('#mmX').hidden=false;$('#mm').classList.add('show');
 tm.push(setTimeout(()=>{if(mm!==cfg)return;$('#mmSpin').classList.add('done');$('#mmT').textContent='LAWAN DITEMUKAN!';$('#mmX').hidden=true;
  tm.push(setTimeout(()=>{if(mm!==cfg)return;mm=null;RF.launch(cfg)},900))},2400))}
$('#mmX').onclick=cancelMM;
$('#back').onclick=()=>RF.navigate('back');$('#home').onclick=()=>RF.navigate('home');
document.documentElement.classList.add('ut-ready');
})();
</script>
</body></html>
