<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a62b8">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<title>Ular Tangga Blok</title>
<style>
/* Pembungkus game (Stage 4.1.19). Landscape / desktop: iframe memenuhi layar.
   HP portrait (pointer kasar): iframe berukuran 100dvh x 100dvw lalu diputar 90° searah jarum jam, sehingga isi game tampil landscape
   memenuhi tinggi layar tanpa pemain memutar HP. Bila HP diputar ke landscape, otomatis kembali normal.
   #ov (layar "Memuat...") memakai geometri yang sama persis dengan #f supaya ikut berputar. */
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a62b8;overscroll-behavior:none}
#f,#ov{position:fixed;left:0;top:0;width:100vw;height:100vh;width:100dvw;height:100dvh;border:0;display:block}
#f{background:#1a62b8}
@media (orientation:portrait) and (pointer:coarse){
  #f,#ov{width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:translateX(100vw) rotate(90deg);transform:translateX(100dvw) rotate(90deg)}
}
/* Layar memuat: muncul seketika saat halaman akan berpindah (tanpa transisi), hilang halus setelah halaman baru benar-benar siap. */
#ov{z-index:10;display:grid;place-items:center;color:#fff;font-family:'Lilita One',system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(ellipse at 50% 60%,rgba(220,246,255,.7),transparent 55%),linear-gradient(180deg,#1357c4 0%,#3b92ee 40%,#8fd0ff 72%,#d4efff 100%)}
#ov.hide{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility 0s linear .25s}
#ov .box{width:min(320px,70%);text-align:center}
#ov .t{font-size:24px;letter-spacing:.04em;text-shadow:0 3px 8px rgba(6,36,74,.28);margin-bottom:14px}
#ov .tr{height:12px;padding:2px;border-radius:99px;background:rgba(7,35,75,.3);border:1px solid rgba(255,255,255,.55);overflow:hidden}
#ov .fl{height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#b8ff63,#65ed26);box-shadow:0 0 12px rgba(125,255,46,.7);animation:mv 1.1s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(150%)}}
@media (prefers-reduced-motion:reduce){#ov .fl{animation:none;width:100%}#ov.hide{transition:none}}
</style>
</head>
<body>
<iframe id="f" title="Ular Tangga Blok" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
<div id="ov" role="status" aria-live="polite"><div class="box"><div class="t">Memuat...</div><div class="tr"><div class="fl"></div></div></div></div>
<noscript>Game ini memerlukan JavaScript.</noscript>
<script>
(function () {
  var f = document.getElementById('f'), ov = document.getElementById('ov'), go = 'splash.html';
  try {
    var q = new URLSearchParams(location.search).get('go');
    // hanya halaman .html di folder yang sama (bukan play.html/index.html) agar tidak jadi open redirect
    if (q && /^[A-Za-z0-9_-]+\.html(\?[^#]*)?(#.*)?$/.test(q) && !/^(play|index)\.html/.test(q)) go = q;
  } catch (e) {}

  /* ================= Layar memuat (kondisional, bukan timer) =================
     Halaman akan pergi (pagehide/beforeunload)  -> layar memuat tampil seketika, menutup jeda kosong.
     Halaman baru selesai (load + font + gambar) -> layar memuat dihilangkan.
     splash.html & loading.html punya layar muat sendiri, jadi layar ini tidak ditampilkan di atasnya. */
  var SELF_LOADING = /^(splash|loading)\.html$/;
  function pageName(w) { try { return (w.location.pathname.split('/').pop() || 'index.html'); } catch (e) { return ''; } }
  function showOv() { ov.classList.remove('hide'); }
  function hideOv() { ov.classList.add('hide'); }

  function whenReady(w, cb) {
    var d; try { d = w.document; } catch (e) { cb(); return; }
    var fonts = (d && d.fonts && d.fonts.ready) ? d.fonts.ready.catch(function () {}) : Promise.resolve();
    var imgs = [];
    try { imgs = Array.prototype.filter.call(d.images || [], function (im) { return !im.complete && im.src; }); } catch (e) {}
    var waits = imgs.map(function (im) { return new Promise(function (r) { im.addEventListener('load', r); im.addEventListener('error', r); }); });
    Promise.all([fonts].concat(waits)).then(function () {
      /* dua frame: beri kesempatan halaman menggambar frame pertamanya sebelum layar memuat dibuka */
      requestAnimationFrame(function () { requestAnimationFrame(cb); });
    });
  }

  /* ================= Suara & musik (dimiliki pembungkus agar tidak putus antar halaman) ================= */
  var STORE = 'ularTanggaBlok:player:v1';
  function settings() {
    try { var s = f.contentWindow.PlayerData.settings(); return { music: s.music !== false, sound: s.sound !== false }; } catch (e) {}
    try { var o = (JSON.parse(localStorage.getItem(STORE) || '{}').settings) || {}; return { music: o.music !== false, sound: o.sound !== false }; } catch (e) {}
    return { music: true, sound: true };
  }
  function musicVol() { try { return Math.max(0, Math.min(100, parseInt(localStorage.getItem('ut-musicvol') || '60', 10) || 60)) / 100; } catch (e) { return 0.6; } }

  /* Musik latar untuk semua halaman selain gameplay (gameplay punya musiknya sendiri).
     Dua lagu yang ada di assets/music diputar bergantian. */
  var TRACKS = ['assets/music/community.mp3', 'assets/music/rainy.mp3'], ti = 0, bgm = null, fadeRaf = 0;
  var wantMusic = false;                     // halaman saat ini boleh bermusik (bukan gameplay)
  function ensureBgm() {
    if (bgm) return bgm;
    try {
      bgm = new Audio(); bgm.preload = 'auto'; bgm.src = TRACKS[ti]; bgm.volume = 0;
      bgm.addEventListener('ended', function () { ti = (ti + 1) % TRACKS.length; bgm.src = TRACKS[ti]; syncMusic(); });
    } catch (e) { bgm = null; }
    return bgm;
  }
  function fadeTo(v, ms, done) {
    cancelAnimationFrame(fadeRaf);
    if (!bgm) { if (done) done(); return; }
    var from = bgm.volume, t0 = performance.now();
    (function step(now) {
      var k = Math.min(1, (now - t0) / ms);
      try { bgm.volume = Math.max(0, Math.min(1, from + (v - from) * k)); } catch (e) {}
      if (k < 1) fadeRaf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }
  var needGesture = false;
  function syncMusic() {
    var on = wantMusic && settings().music && !document.hidden;
    if (on) {
      if (!ensureBgm()) return;
      if (bgm.paused) {
        var p; try { p = bgm.play(); } catch (e) {}
        if (p && p.catch) p.catch(function () { needGesture = true; });   // diblokir browser: coba lagi pada gesture pertama
        else if (!p) needGesture = true;
      }
      fadeTo(musicVol(), 400);
    } else if (bgm && !bgm.paused) {
      fadeTo(0, 300, function () { if (!(wantMusic && settings().music && !document.hidden)) { try { bgm.pause(); } catch (e) {} } });
    }
  }
  function onGesture() { if (needGesture) { needGesture = false; syncMusic(); } }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(function (ev) { window.addEventListener(ev, onGesture, true); });
  document.addEventListener('visibilitychange', syncMusic);

  /* Suara ketukan tombol: kolam kecil agar ketukan beruntun tidak saling memotong; tetap bunyi walau halaman langsung berpindah. */
  var clickPool = [], clickI = 0;
  function playClick() {
    if (!settings().sound) return;
    try {
      if (!clickPool.length) for (var i = 0; i < 4; i++) { var a = new Audio('assets/sfx/button-click.mp3'); a.preload = 'auto'; a.volume = 0.7; clickPool.push(a); }
      var el = clickPool[clickI++ % clickPool.length]; el.currentTime = 0;
      var p = el.play(); if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  window.UTShell = { click: playClick, syncMusic: syncMusic };   // dipakai UT.Audio di halaman (app.js)

  /* Setelah setiap ketukan di halaman, baca ulang pengaturan (toggle Musik/Suara di Pengaturan berlaku seketika). */
  function afterTap() { setTimeout(syncMusic, 0); setTimeout(syncMusic, 120); }

  /* ================= Pasang pada setiap halaman yang dimuat di iframe ================= */
  f.addEventListener('load', function () {
    var w; try { w = f.contentWindow; w.document; } catch (e) { hideOv(); return; }
    var name = pageName(w);

    // layar memuat
    if (SELF_LOADING.test(name)) hideOv(); else whenReady(w, hideOv);
    var leave = function () { showOv(); };
    try {
      w.addEventListener('beforeunload', leave);
      w.addEventListener('pagehide', leave);
      w.addEventListener('pageshow', function (e) { if (e.persisted) hideOv(); });
    } catch (e) {}

    // musik: gameplay = berhenti; splash/loading = biarkan apa adanya; selain itu = bermusik
    if (name === 'gameplay.html') { wantMusic = false; syncMusic(); }
    else if (!SELF_LOADING.test(name)) { wantMusic = true; syncMusic(); }
    try { w.focus(); } catch (e) {}
    try { w.document.addEventListener('click', afterTap, true); } catch (e) {}
  });
  f.src = go;
})();
</script>
</body>
</html>
