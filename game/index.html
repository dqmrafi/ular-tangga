<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ular Tangga Blok</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<script src="assets/js/landscape.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1a62b8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Ular Tangga"><link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:linear-gradient(#2d8cf0,#1a62b8);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
main{width:min(360px,100%);text-align:center}
.logo{width:128px;height:128px;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 16px 28px rgba(0,0,0,.25);image-rendering:auto}
h1{margin:18px 0 4px;font-size:30px;letter-spacing:.3px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
p{margin:0 0 22px;opacity:.9;font-size:15px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font:inherit;font-weight:800;font-size:17px;color:#fff;cursor:pointer;text-decoration:none;margin-top:12px}
.play{background:linear-gradient(#ffd24d,#f4a81f);color:#5a3500;box-shadow:0 5px 0 #b9740c}
.inst{background:linear-gradient(#4aa8ff,#1f6fe0);box-shadow:0 5px 0 #124a9c}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn[hidden]{display:none}
.hint{margin-top:18px;font-size:13px;opacity:.85;line-height:1.5}
.hint[hidden]{display:none}
@media (orientation:landscape) and (max-height:520px){main{width:min(560px,100%);display:grid;grid-template-columns:auto 1fr;column-gap:24px;text-align:left;align-items:center}.logo{grid-row:1/6;width:112px;height:112px}h1{margin:0 0 4px;font-size:26px}p{margin-bottom:10px}.btn{margin-top:8px;padding:12px 16px}.hint{margin-top:10px}}
</style></head>
<body>
<main>
<img class="logo" src="assets/icons/icon-192.png" width="128" height="128" alt="">
<h1>Ular Tangga Blok</h1>
<p>Lempar dadu, panjat tangga, hindari ular.</p>
<a class="btn play" id="play" href="splash.html">Main Sekarang</a>
<button class="btn inst" id="install" type="button" hidden>Pasang Aplikasi</button>
<div class="hint" id="hint" hidden></div>
</main>
<script>
(function(){
  /* Aplikasi terpasang (standalone/fullscreen): langsung masuk game. Di browser biasa halaman ini tetap tampil agar bisa dipasang. */
  var standalone=(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches))||navigator.standalone===true;
  if(standalone){ location.replace('splash.html'); return; }
  var inst=document.getElementById('install'),hint=document.getElementById('hint'),ev=null;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); ev=e; inst.hidden=false; hint.hidden=true; });
  inst.addEventListener('click',function(){ if(!ev) return; ev.prompt(); ev.userChoice.then(function(){ ev=null; inst.hidden=true; }); });
  window.addEventListener('appinstalled',function(){ inst.hidden=true; hint.hidden=false; hint.textContent='Terpasang! Buka dari layar utama.'; });
  setTimeout(function(){ if(!ev&&inst.hidden){ hint.hidden=false; hint.textContent=ios?'Untuk memasang: ketuk Bagikan lalu "Tambah ke Layar Utama".':'Untuk memasang: buka menu browser (⋮) lalu pilih "Instal aplikasi".'; } },1500);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){}); });
  }
})();
</script>
</body></html>
