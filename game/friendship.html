<!DOCTYPE html>
<html lang="id" class="stage16">
<head><script src="assets/js/frame-guard.js"></script><script src="assets/js/boot-guard.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman — Voxel Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/base.css"><style>
:root{
  --ol:#08112b;            /* outline hitam-navy */
  --bd:#08112b;
  --g:#3cc23c;--red:#ee4a4a;
  --navy:#10286a;
  --px:0 -.3rem 0 0 var(--ol),0 .3rem 0 0 var(--ol),-.3rem 0 0 0 var(--ol),.3rem 0 0 0 var(--ol);       /* outline piksel (sudut bertakik) */
  --pxs:0 -.2rem 0 0 var(--ol),0 .2rem 0 0 var(--ol),-.2rem 0 0 0 var(--ol),.2rem 0 0 0 var(--ol);
  --bev:inset .24rem .24rem 0 rgba(255,255,255,.34),inset -.24rem -.24rem 0 rgba(0,0,0,.3);
  --bevs:inset .18rem .18rem 0 rgba(255,255,255,.16),inset -.18rem -.18rem 0 rgba(0,0,0,.35);
  --lip:0 .6rem 0 0 var(--ol);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html{font-size:min(1vw,1.78vh)}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2','Fredoka','Nunito',system-ui,sans-serif;font-weight:800;color:#fff;background:linear-gradient(#5db4f5,#a9dcf8 60%,#d5f0ff)}
button,input{font:inherit;color:inherit;border:0;border-radius:0}
button{cursor:pointer;transition:transform .1s,filter .1s}
button:hover{transform:translateY(-.1rem);filter:brightness(1.1)}button:active{transform:translateY(.3rem);filter:brightness(.95)}
button:focus-visible,input:focus-visible{outline:.3rem solid #fff}
#sky{position:fixed;inset:0;overflow:hidden;pointer-events:none}.isl{position:absolute;opacity:.65;animation:fl 6s ease-in-out infinite}.isl i{display:block;background:#6fbf4a}.isl b{display:block;background:#8a5a3a;margin:0 auto}@keyframes fl{50%{translate:0 -.8rem}}
.ab{position:absolute}
.blue{background:linear-gradient(#4f94ff,#2459d0);box-shadow:var(--bev),var(--px),var(--lip);text-shadow:0 .18rem 0 var(--ol)}
svg{display:block}
#back{left:1.8rem;top:1.8rem;width:4.7rem;height:4.7rem;padding:0;display:grid;place-items:center}#back svg{width:3rem;height:3rem;filter:drop-shadow(0 .18rem 0 var(--ol))}
#title{left:8rem;top:1.8rem;width:22rem;height:4.7rem;display:flex;align-items:center;gap:1.2rem;padding-left:2rem;font-size:3.4rem;text-shadow:0 .22rem 0 var(--ol)}#title svg{width:3.4rem;height:3.4rem;filter:drop-shadow(0 .18rem 0 var(--ol))}
#gear{right:1.8rem;top:1.9rem;width:4.5rem;height:4.5rem;padding:0;display:grid;place-items:center}#gear svg{width:2.8rem;height:2.8rem;filter:drop-shadow(0 .18rem 0 var(--ol))}

/* panel kiri (karakter 3D) */
#hero{left:1.8rem;top:8.6rem;bottom:2.4rem;width:34rem;background:linear-gradient(#2f6fe2,#1d4cb8);box-shadow:var(--bev),var(--px),var(--lip);overflow:hidden}
#hero h2{position:absolute;left:2rem;top:1.3rem;margin:0;font-size:2.7rem;text-shadow:0 .2rem 0 var(--ol)}
#hero p{position:absolute;left:2rem;top:5rem;right:2rem;margin:0;color:#e7f7ff;font-size:1.35rem;line-height:1.25;text-shadow:0 .12rem 0 var(--ol)}
#character{position:absolute;left:0;right:0;top:10.2rem;bottom:7.6rem;touch-action:pan-y}#character canvas{width:100%;height:100%;display:block;cursor:grab}#character canvas:active{cursor:grabbing}.noGL{height:100%;display:grid;place-items:center;font-size:6rem}
.heroBtn{position:absolute;bottom:1.8rem;left:2rem;right:2rem;height:4.6rem;font-size:1.9rem;background:linear-gradient(#ffd23e,#f09a12);box-shadow:var(--bev),var(--px),var(--lip);text-shadow:0 .16rem 0 #8a4a06}

/* panel kanan (daftar teman) */
#main{left:37.4rem;right:1.8rem;top:8.6rem;bottom:2.4rem;padding:1.2rem;background:linear-gradient(#2a62d6,#1a449f);box-shadow:var(--bev),var(--px),var(--lip);display:flex;flex-direction:column;gap:1.1rem}
#mainTop{display:flex;gap:1rem;align-items:center;flex:none;padding:0 .3rem .5rem}
.tab{height:4rem;min-width:11rem;background:linear-gradient(#4f94ff,#2459d0);box-shadow:var(--bev),var(--px),var(--lip);font-size:1.7rem;padding:0 1.5rem;text-shadow:0 .16rem 0 var(--ol)}
.tab.on{background:linear-gradient(#fff6cf,#f2d77a);box-shadow:inset .24rem .24rem 0 rgba(255,255,255,.7),inset -.24rem -.24rem 0 rgba(160,110,10,.35),var(--px),var(--lip);color:#4a3200;text-shadow:none}
#searchRow{display:flex;gap:1rem;align-items:center;flex:none;padding:0 .3rem}
.search{height:4.2rem;flex:1;background:var(--navy);box-shadow:inset 0 .25rem 0 rgba(0,0,0,.4),var(--pxs);display:flex;align-items:center;padding:0 1.3rem;gap:.7rem}.search svg{width:2.1rem;flex:none}.search input{width:100%;height:100%;background:transparent;outline:0;font-size:1.45rem}.search input::placeholder{color:#a9c6f0}
.add{height:4.2rem;padding:0 1.6rem;background:linear-gradient(#ffd23e,#f09a12);box-shadow:var(--bev),var(--px),var(--lip);font-size:1.5rem;text-shadow:0 .14rem 0 #8a4a06}
#list{flex:1;min-height:0;overflow:auto;padding:1rem .9rem .9rem;background:#0f2766;box-shadow:inset .25rem .25rem 0 rgba(0,0,0,.45),var(--pxs)}
#friends{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,38rem),1fr));gap:1rem;align-content:start}
.friend{min-width:0;min-height:6.8rem;padding:.6rem .9rem;display:grid;grid-template-columns:5.5rem 1fr auto;align-items:center;gap:1rem;background:linear-gradient(#2a62d6,#1a4cb8);box-shadow:var(--bevs),var(--pxs);animation:pop .25s both;text-shadow:0 .14rem 0 var(--ol)}
.friend:hover{filter:brightness(1.1)}@keyframes pop{from{opacity:0;transform:translateY(.5rem)}}
.avatar{width:5.2rem;height:5.2rem;background:linear-gradient(#5db4f5,#a9dcf8);border:.2rem solid var(--ol);box-shadow:0 0 0 .2rem #8aa8e0;display:grid;place-items:center;overflow:hidden}.avatar svg{width:100%;height:100%}
.finfo{min-width:0}.name{font-size:1.65rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:.8rem;color:#dff3ff;font-size:1.05rem;margin-top:.25rem}
.dot{width:.9rem;height:.9rem;background:#3eea59;box-shadow:0 0 0 .15rem var(--ol)}.dot.off{background:#9aaac0}.dot.busy{background:#ffd24d}
.actions{display:flex;gap:.7rem}
.act{height:3.4rem;min-width:8rem;padding:0 1rem;background:linear-gradient(#4f94ff,#2459d0);box-shadow:var(--bevs),var(--pxs),0 .45rem 0 0 var(--ol);font-size:1.15rem;text-shadow:0 .12rem 0 var(--ol)}
.act.play{background:linear-gradient(#4fd25a,#23932f)}
.act.remove{background:linear-gradient(#f4705f,#c4291f)}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:#dff3ff;font-size:1.5rem}.empty div{max-width:30rem}
.badgeCount{margin-left:.5rem;padding:.2rem .8rem;background:var(--navy);color:#fff;box-shadow:var(--pxs);font-size:1rem;text-shadow:0 .1rem 0 var(--ol)}
.request .act{background:linear-gradient(#ffd23e,#f09a12);text-shadow:0 .12rem 0 #8a4a06}
#toast{position:fixed;left:50%;bottom:3rem;translate:-50% 2rem;background:var(--navy);padding:.8rem 2.4rem;box-shadow:var(--bevs),var(--px);font-size:2rem;opacity:0;transition:opacity .3s,translate .3s;z-index:99;pointer-events:none;white-space:nowrap;text-shadow:0 .14rem 0 var(--ol)}.toastOn{opacity:1!important;translate:-50% 0!important}

/* modal (gaya piksel) */
.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,17,43,.5);z-index:50;opacity:0;transition:opacity .25s}.ov.show{opacity:1}
.box{position:relative;width:min(46rem,92vw);max-height:90vh;overflow:auto;background:linear-gradient(#2f6fe2,#1d4cb8);padding:3rem 2.4rem 2.4rem;box-shadow:var(--bev),var(--px),0 .9rem 0 0 var(--ol);font-size:1.5rem;text-align:center;transform:scale(.9);transition:transform .2s}.ov.show .box{transform:scale(1)}
.box h2{margin:0 0 1rem;font-size:3rem;text-shadow:0 .22rem 0 var(--ol)}
.x{position:absolute;right:-1rem;top:-1rem;width:4.6rem;height:4.6rem;background:linear-gradient(#f4705f,#c4291f);box-shadow:var(--bev),var(--px);font-size:2.4rem;padding:0;text-shadow:0 .16rem 0 #6a120c}
.modalBtns{display:flex;gap:1.2rem;justify-content:center;margin-top:1.2rem}
.modalBtn{height:4.2rem;padding:0 1.8rem;background:linear-gradient(#ffd23e,#f09a12);box-shadow:var(--bev),var(--px),var(--lip);font-size:1.5rem;text-shadow:0 .14rem 0 #8a4a06}
.modalBtn.no{background:linear-gradient(#8a96ad,#5a667e);text-shadow:0 .14rem 0 var(--ol)}

@media(max-aspect-ratio:1/1){html{font-size:2.5vw}body{overflow:auto}#ui{position:relative;min-height:100vh;display:flex;flex-direction:column;gap:1.4rem;padding:1.4rem}.ab{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important}#top{display:flex;flex-wrap:wrap;align-items:center;gap:1.4rem}#title{order:0;width:auto;flex:1;min-width:15rem}#hero{width:auto;height:42rem;order:1}.heroBtn{bottom:1.2rem}.main,#main{order:2;left:auto;right:auto;top:auto;bottom:auto;width:auto;height:65rem;min-height:65rem}.friend{grid-template-columns:5rem 1fr}.actions{grid-column:2}.actions .act{flex:1}.avatar{width:4.7rem;height:4.7rem}.name{font-size:1.45rem}.tab{min-width:9rem;font-size:1.35rem;padding:0 1rem}.search input{font-size:1.25rem}}
</style>
<style>:root{--curbar-right:7.6rem;--curbar-top:2.05rem;}</style><link rel="stylesheet" href="assets/css/shared-ui.css?v=title2">
<style>
/* override shared-ui.css (dimuat sebelum blok ini): currency sama dengan lobi, modal gaya piksel; shared-ui.css sendiri tidak diubah */
:root{--cur-h:4.2rem;--cur-icon:5rem;--cur-plus:2.8rem;--cur-fs:2.4rem;--cur-minw:17.1rem;--cur-gap:1.2rem}

</style><script src="assets/js/landscape.js"></script></head>

<script>
(()=>{
const $=s=>document.querySelector(s);
// currency dari PlayerData (single source of truth) — angka hardcoded di HTML hanya fallback noscript
const PD=window.PlayerData,fmt=n=>n.toLocaleString('id-ID');
function renderCurrency(){$('#gemV').textContent=fmt(PD.gems());$('#coinV').textContent=fmt(PD.coins())}
renderCurrency();
UT.Events.on('currencyChanged',renderCurrency);
const friends=[
{id:1,name:'RakaPlay',level:28,status:'online',mode:'Lobby',skin:0x22b8d8},
{id:2,name:'NayaCraft',level:24,status:'online',mode:'Menunggu',skin:0x9a4ae0},
{id:3,name:'BimaGG',level:31,status:'busy',mode:'Ranked',skin:0xf0b030},
{id:4,name:'AlyaVoxel',level:19,status:'online',mode:'Lobby',skin:0x4acb58},
{id:5,name:'DinoRush',level:35,status:'offline',mode:'Offline',skin:0xd23a32},
{id:6,name:'KikoPlay',level:17,status:'offline',mode:'Offline',skin:0x5a75d6}
];
const requests=[{id:101,name:'FajarCube',level:21,status:'online',mode:'Mengirim permintaan',skin:0x35d3f0},{id:102,name:'SalsaFun',level:26,status:'online',mode:'Mengirim permintaan',skin:0xff7ad0}];
let filter='online',query='';
function avatar(color,seed){return `<svg viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#a9dcf8"/><ellipse cx="50" cy="82" rx="31" ry="9" fill="#6fbf4a" opacity=".75"/><rect x="31" y="27" width="38" height="31" rx="3" fill="#f1c49b"/><rect x="27" y="23" width="46" height="13" rx="3" fill="#7a4a2a"/><rect x="26" y="50" width="48" height="32" rx="3" fill="${'#'+color.toString(16).padStart(6,'0')}"/><rect x="39" y="38" width="6" height="6" fill="#24335a"/><rect x="55" y="38" width="6" height="6" fill="#24335a"/><rect x="42" y="49" width="16" height="3" rx="1.5" fill="#a45a4d"/></svg>`}
function statusText(f){return f.status==='online'?'Online':f.status==='busy'?'Sedang bermain':'Offline'}
function render(){
 const source=filter==='request'?requests:friends;
 const arr=source.filter(f=>(f.name+' '+f.level).toLowerCase().includes(query.toLowerCase())).filter(f=>filter!=='online'||f.status==='online');
 $('#friends').innerHTML=arr.length?arr.map((f,i)=>`<article class="friend ${filter==='request'?'request':''}" data-id="${f.id}" style="animation-delay:${i*35}ms"><div class="avatar">${avatar(f.skin,i)}</div><div class="finfo"><div class="name">${f.name}</div><div class="meta"><span class="dot ${f.status==='offline'?'off':f.status==='busy'?'busy':''}"></span>Lv. ${f.level} · ${statusText(f)}${f.status!=='offline'&&filter!=='request'?` · ${f.mode}`:''}</div></div><div class="actions">${filter==='request'?`<button class="act accept">Terima</button><button class="act remove decline">Tolak</button>`:f.status==='online'?`<button class="act play">Ajak Main</button><button class="act remove" data-action="remove">Hapus</button>`:`<button class="act" data-action="profile">Profil</button>`}</div></article>`).join(''):`<div class="empty"><div><div style="font-size:4rem">👥</div><p>Tidak ada teman yang ditemukan.</p></div></div>`;
 $('#onlineCount').textContent=friends.filter(x=>x.status==='online').length;
 $('#reqCount').textContent=requests.length;
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('toastOn');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('toastOn'),1800)}
function openModal(html){$('#mb').innerHTML=html;$('#modal').style.display='grid';requestAnimationFrame(()=>$('#modal').classList.add('show'))}
function closeModal(){ $('#modal').classList.remove('show');setTimeout(()=>$('#modal').style.display='none',220)}
function addFriend(){openModal(`<h2>Tambah Teman</h2><p>Masukkan username pemain yang ingin kamu tambahkan.</p><label class="search" style="height:4.2rem;width:100%;display:flex;margin:1rem 0"><input id="friendName" placeholder="Contoh: Player123" style="text-align:center"></label><div class="modalBtns"><button class="modalBtn no" id="cancel">Batal</button><button class="modalBtn" id="send">Kirim Permintaan</button></div>`);$('#cancel').onclick=closeModal;$('#send').onclick=()=>{const n=$('#friendName').value.trim();if(!n){toast('Masukkan username dulu.');return}closeModal();toast('Permintaan teman dikirim!')}}
$('#search').addEventListener('input',e=>{query=e.target.value;render()});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()}));
$('#addBtn').onclick=addFriend;$('#inviteHero').onclick=addFriend;$('#mx').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
$('#back').onclick=()=>{location.href='lobby.html'};$('#gear').onclick=()=>toast('Pengaturan dibuka');
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action],.accept,.decline,.play');if(!btn)return;const card=btn.closest('.friend');const id=Number(card?.dataset.id);const f=[...friends,...requests].find(x=>x.id===id);if(btn.classList.contains('accept')){const idx=requests.findIndex(x=>x.id===id);if(idx>-1){friends.push({...requests[idx],status:'online',mode:'Lobby'});requests.splice(idx,1);filter='online';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.filter===filter));render();toast(f.name+' sekarang menjadi teman!')}}else if(btn.classList.contains('decline')){const idx=requests.findIndex(x=>x.id===id);if(idx>-1)requests.splice(idx,1);render();toast('Permintaan ditolak.')}else if(btn.classList.contains('play')){toast('Undangan bermain dikirim ke '+f.name+'!')}else if(btn.dataset.action==='remove'){const idx=friends.findIndex(x=>x.id===id);if(idx>-1)friends.splice(idx,1);render();toast('Teman dihapus.')}else if(btn.dataset.action==='profile'){openModal(`<h2>${f.name}</h2><p>Level ${f.level}<br>${statusText(f)}${f.mode?' · '+f.mode:''}</p><div class="modalBtns"><button class="modalBtn" onclick="document.querySelector('#mx').click()">Tutup</button></div>`)}});
// ---- 3D: sistem yang sama dengan inventory (character + island voxel + rig + drag putar)
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const bx=(w,h,d,m,x=0,y=0,z=0,p)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;p&&p.add(o);return o};
function character(sk,emote){const g=new THREE.Group(),P={};const skin=M(0xf0b98d),hood=M(sk.hood),hair=M(sk.hair),pants=M(sk.pants),wh=M(0xffffff),bl=M(0x2f6fd0),pk=M(0x7a4a2a),dk=M(0x221a18);
 const body=new THREE.Group();body.position.y=2.6;g.add(body);P.body=body;
 bx(1.7,1.9,1,hood,0,0,0,body);bx(.9,1.1,.1,wh,0,-.1,.52,body);bx(1.1,1.4,.5,pk,0,0,-.75,body);
 const head=new THREE.Group();head.position.y=2.1;body.add(head);P.head=head;
 bx(2.2,2.1,2.1,skin,0,0,0,head);bx(2.4,.8,2.3,hair,0,1.15,-.05,head);bx(2.4,1.8,.5,hair,0,.2,-1,head);bx(.4,1.2,2.1,hair,-1.2,.4,0,head);bx(.4,1.2,2.1,hair,1.2,.4,0,head);bx(2.2,.5,.5,hair,0,.8,1.05,head);
 P.eyes=[-.55,.55].map(x=>{const e=new THREE.Group();e.position.set(x,.05,1.06);head.add(e);bx(.42,.55,.1,dk,0,0,0,e);bx(.14,.16,.1,wh,.08,.12,.06,e);return e});
 bx(.7,.15,.1,M(0xc0473a),0,-.6,1.06,head);
 const arm=x=>{const a=new THREE.Group();a.position.set(x,.8,0);body.add(a);bx(.7,1.5,.7,hood,0,-.6,0,a);bx(.6,.5,.6,skin,0,-1.5,0,a);return a};
 P.aL=arm(-1.2);P.aR=arm(1.2);
 const leg=x=>{const l=new THREE.Group();l.position.set(x,-1,0);body.add(l);bx(.8,1.4,.9,pants,0,-.6,0,l);bx(1,.5,1.3,wh,0,-1.45,.15,l);bx(1.02,.18,1.32,bl,0,-1.2,.15,l);return l};
 P.lL=leg(-.45);P.lR=leg(.45);
 g.userData.anim=t=>{const k=emote||'idle',sw=Math.sin(t*10);P.body.position.y=2.6+Math.sin(t*2)*.05;P.body.scale.y=1+Math.sin(t*2)*.012;P.head.rotation.set(0,Math.sin(t*.7)*.12,Math.sin(t*.9)*.03);
  P.aL.rotation.z=-.15;P.aR.rotation.z=.15;g.position.y=Math.sin(t*1.6)*.08;P.body.rotation.z=0;
  if(k==='idle')P.aR.rotation.z=.15-Math.sin(t*2)*.05+(Math.sin(t*.4)>.97?1:0);
  if(k==='wave'){P.aR.rotation.z=2.4+Math.sin(t*10)*.35}
  P.eyes.forEach(e=>e.scale.y=(t%4<.15)?.1:1)};
 return g}
function island(){const g=new THREE.Group(),cells=[];for(let y=0;y>-4;y--){const r=y===0?3.2:y===-1?3:Math.max(1,3.2+y*.8);for(let x=-3;x<=3;x++)for(let z=-3;z<=3;z++)if(Math.hypot(x,z)<=r+(((x*7+z*13+y*5)%3)*.15)-.2)cells.push([x,y,z])}
 const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({roughness:.8}),cells.length),m4=new THREE.Matrix4(),col=new THREE.Color();
 cells.forEach((c,i)=>{m4.setPosition(c[0],c[1]-.5,c[2]);m.setMatrixAt(i,m4);m.setColorAt(i,col.setHex(c[1]===0?((c[0]+c[2])&1?0x58b83c:0x4fae36):c[1]===-1?0x8a5a3a:(c[0]*c[2]%3===0?0x7a7a80:0x754b30)))});m.castShadow=m.receiveShadow=true;g.add(m);
 for(let i=0;i<7;i++){const a=i*2.3;bx(.2,.5+.3*(i%2),.2,M(0x3fa83a),Math.cos(a)*2.4,.25,Math.sin(a)*2.4,g)}bx(.25,.25,.25,M(0xffffff),-1.8,.4,1.5,g);bx(.9,.25,.9,M(0x9a9aa0),2,.12,1.9,g);
 const glow=new THREE.Mesh(new THREE.RingGeometry(3.4,4.3,40),new THREE.MeshBasicMaterial({color:0xbfeaff,transparent:true,opacity:.6,side:THREE.DoubleSide}));glow.rotation.x=-Math.PI/2;glow.position.y=-3.6;g.add(glow);return g}
/* skin yang sedang dipakai pemain (sama dengan inventory); fallback ke palet default */
function palette(){try{const p=window.ItemArt&&ItemArt.palette(PD.equippedId('skin'));if(p)return p}catch(e){}return{hood:'#00a8a8',hair:'#4a2e13',pants:'#3b4fd8'}}
let R=null;
function init3D(){const cv=$('#gl'),r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;
 const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(36,1,.1,100);scene.add(new THREE.AmbientLight(0xffffff,.6),new THREE.HemisphereLight(0xcfeaff,0x6a9a50,.6));
 const sun=new THREE.DirectionalLight(0xfff2d8,.9);sun.position.set(6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:10,bottom:-6});scene.add(sun);
 const holder=new THREE.Group();scene.add(holder);holder.add(island());const ch=character(palette(),'wave');holder.add(ch);
 R={r,scene,cam,holder,cv,ch,cy:1.3,dist:19,fov:36,rot:0,vel:0,drag:false,clock:new THREE.Clock()};
 cv.addEventListener('pointerdown',e=>{R.drag=true;R.lx=e.clientX;cv.setPointerCapture(e.pointerId)});
 cv.addEventListener('pointermove',e=>{if(R.drag){R.vel=(e.clientX-R.lx)*.012;R.rot+=R.vel;R.lx=e.clientX}});
 const up=()=>R.drag=false;cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 new ResizeObserver(fit3D).observe(cv);fit3D();requestAnimationFrame(loop3D)}
function fit3D(){if(!R)return;let hi=true;try{hi=PD.settings().graphics==='high'}catch(e){}const w=R.cv.clientWidth,h=R.cv.clientHeight;if(!w||!h)return;
 R.r.setPixelRatio(hi?Math.min(devicePixelRatio,1.5):1);R.r.setSize(w,h,false);R.cam.aspect=w/h;R.cam.fov=R.fov*(w/h<.8?1.15:1);R.cam.updateProjectionMatrix()}
function loop3D(){requestAnimationFrame(loop3D);if(!R||!R.cv.offsetParent)return;const t=R.clock.getElapsedTime();
 if(!R.drag){R.vel*=.95;R.rot+=R.vel+.004}R.holder.rotation.y=R.rot;R.ch.userData.anim(t);
 R.cam.position.set(0,R.cy+1,R.dist);R.cam.lookAt(0,R.cy,0);R.r.render(R.scene,R.cam)}

(()=>{const sk=$('#sky');[[5,60,6],[18,30,4],[30,70,5],[62,16,5],[86,48,7],[92,12,4],[2,20,5],[75,75,6],[45,85,4]].forEach((p,i)=>{const e=document.createElement('div');e.className='isl';e.style.cssText=`left:${p[0]}%;top:${p[1]}%;animation-delay:${-i}s;filter:blur(${i%3}px)`;e.innerHTML=`<i style="width:${p[2]}rem;height:${p[2]*.4}rem"></i><b style="width:${p[2]*.7}rem;height:${p[2]*.6}rem"></b>`;sk.appendChild(e)})})();
