#tt b{font-size:2.8rem;-webkit-text-stroke:.3rem var(--ink);paint-order:stroke fill;white-space:nowrap}#tt small{font-size:1.4rem;font-weight:700;color:#d8efff;white-space:nowrap}

.tr.sl{display:flex;width:100%;border:0;text-align:left;font-size:1.3rem;color:#8a6a3a;background:linear-gradient(#fbf3df,#efe2c2);box-shadow:0 0 0 .2rem var(--ink)}
.tr.sl .bd{opacity:.6;font-size:1.6rem}
.tr.sl .pi{flex:1}.tr.sl .pi b{color:#8a6a3a;font-size:1.35rem}
.tr .add{align-self:center;flex:none;margin-right:.6rem;padding:.2rem 1rem;border-radius:.8rem;font-size:1.2rem;color:#fff;background:linear-gradient(#4fd24a,#27992a);box-shadow:0 0 0 .15rem var(--ink);text-shadow:0 .1rem 0 #0e4a12}

[hidden]{display:none!important}

.ov{position:fixed;inset:0;display:none;place-items:center;background:rgba(18,51,127,.55);backdrop-filter:blur(6px);z-index:50}.ov.show{display:grid}
.box{position:relative;width:min(46rem,92vw);max-height:min(86dvh,56rem);display:flex;flex-direction:column;padding:1.6rem;border-radius:1.6rem}
.box h2{margin:0 0 .6rem;font-size:2.6rem;text-align:center;-webkit-text-stroke:.35rem var(--ink);paint-order:stroke fill}
.x{position:absolute;right:-1rem;top:-1rem;width:4.4rem;height:4.4rem;border-radius:50%;background:#ee4a4a;box-shadow:0 0 0 .2rem var(--ink);padding:0;font-size:2.2rem}
.fr{display:flex;align-items:center;gap:.9rem;padding:.6rem .8rem;border-radius:1rem;background:rgba(255,255,255,.14)}
.on_{color:#8dff8d}.off_{color:#a9b5cc}.wt_{color:#ffe36a}
#toast{position:fixed;left:50%;bottom:9rem;translate:-50% 2rem;background:var(--bd);padding:.8rem 2.4rem;border-radius:2rem;font-size:1.9rem;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}#toast.on{opacity:1;translate:-50% 0}
/* portrait: karakter atas, Power + Player berdampingan, scroll hanya di dalam panel */
@media(max-aspect-ratio:1/1){
html{font-size:min(2.6vw,1.45vh)}
#room{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,40fr) minmax(0,48fr) auto;grid-template-areas:"hd hd" "ch ch" "pw pl" "ac ac"}
#tt{min-width:0;max-width:62%;padding:0 1rem}#tt b{font-size:2.3rem}
.pn{padding:.8rem}.pn h2{font-size:1.7rem}
#room{grid-template-rows:auto minmax(0,46fr) minmax(0,42fr) auto}
#opts{max-height:8.4rem;grid-template-columns:repeat(auto-fill,minmax(7rem,1fr))}
.op{min-height:6.2rem}.op>span:first-child{width:3.6rem;height:3.6rem}
.pv{bottom:.4rem;padding:.2rem;max-width:40%}.pv .im{width:3.6rem;height:3.6rem}.pv span:last-child{display:none}
.tab{min-height:3.8rem}.tabs{margin:.5rem 0 .4rem}
.pr{flex-wrap:wrap;gap:.4rem .6rem}.pr .t{flex:1 1 40%}.pr .bt{flex:1 0 100%;min-height:3.8rem}
.pp{flex-wrap:wrap;gap:.4rem .6rem}.pi{flex:1 1 50%}.st{margin-left:auto}.mv{width:3.8rem;height:3.8rem}

#ac{flex-wrap:wrap;gap:.6rem;padding:.8rem}#sttx{flex:1 0 100%;font-size:1.5rem}.big{flex:1;min-width:0;height:4.8rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 </header>

<script>
(()=>{
const $=s=>document.querySelector(s),PD=window.PlayerData,IC=window.ItemCatalog,RF=UT.RoomFlow,fmt=n=>n.toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1900)}
/* ---------- URL -> konfigurasi room (URL tidak valid -> Mode Selection) ---------- */
const q=new URLSearchParams(location.search),MODE=q.get('mode');
if(RF.MODES.indexOf(MODE)<0){location.replace('mode.html');return}
const ONLINE=MODE==='online',FORMAT=(ONLINE&&q.get('format')==='team')?'team':'solo',TEAM=ONLINE&&FORMAT==='team';
const COUNT=ONLINE?4:Math.min(4,Math.max(2,parseInt(q.get('count'),10)||2));
const HOST=!(ONLINE&&q.get('role')==='guest');
const jc=(q.get('code')||'').toUpperCase(),JOIN=(!HOST&&/^[A-Z0-9]{4,8}$/.test(jc))?jc:null;
const MAP=RF.getMap();
/* DATA DEMO (ganti dengan API/server): harga Power belum ada di katalog (price:null), teman belum punya backend */
const POWER_PRICE={sword:150,feather:120,tnt:200,totem:250,potion_odd:100,potion_even:100,grass:180};
const FRIENDS=[{id:'l1',src:'line',name:'Mike',online:true,level:21},{id:'l2',src:'line',name:'Lisa',online:true,level:18},{id:'l3',src:'line',name:'Dodi',online:false,level:9},
{id:'g1',src:'game',name:'RakaPlay',online:true,level:28},{id:'g2',src:'game',name:'NayaCraft',online:true,level:24},{id:'g3',src:'game',name:'AlyaVoxel',online:true,level:19},{id:'g4',src:'game',name:'DinoRush',online:false,level:35}];
const myName=()=>PD.profile().name||'Kamu',myLevel=()=>1+Math.floor(PD.xp()/100);
const eqItem=slot=>IC.byId(PD.equippedId(slot));
const S={cust:'skin',invTab:'line',invites:{},timers:[],room:null,hostT:null};
const PK='ut-room-powers:v1';
function loadP(){try{const d=JSON.parse(localStorage.getItem(PK)||'{}');return{owned:d.owned||[],equipped:(d.equipped||[]).slice(0,5)}}catch(e){return{owned:[],equipped:[]}}}
const PW=loadP();const saveP=()=>{try{localStorage.setItem(PK,JSON.stringify(PW))}catch(e){}};
const POWERS=IC.items.filter(i=>i.kind==='powerup');
function clearT(){S.timers.forEach(clearTimeout);S.timers=[];clearTimeout(S.hostT);S.hostT=null;Object.values(S.invites).forEach(v=>clearTimeout(v.timer))}
/* ---------- navigasi ---------- */
const leave=to=>{clearT();RF.navigate(to)};
$('#back').onclick=()=>leave('mode');$('#home').onclick=()=>leave('home');
/* ---------- setup room ---------- */
function setup(){
 const P=[];
 if(ONLINE&&!HOST)P.push({id:'host',name:'Mike',level:21,ready:false,team:1,kind:'host'},{id:'me',name:myName(),level:myLevel(),ready:false,team:TEAM?1:0,kind:'friend'});
 else P.push({id:'me',name:myName(),level:myLevel(),ready:false,team:TEAM?1:0,kind:'host'});
 if(MODE==='vsc')for(let i=1;i<COUNT;i++)P.push({id:'b'+i,name:'Bot '+i,level:rand(4,20),ready:true,team:0,kind:'bot'});
 if(MODE==='local')for(let i=1;i<COUNT;i++)P.push({id:'p'+i,name:'Pemain '+(i+1),level:1,ready:true,team:0,kind:'local'});
 if(!HOST)[['f_g2','RakaPlay',28],['f_g3','NayaCraft',24]].forEach((f,i)=>{if(P.length<COUNT)P.push({id:f[0],fid:'g'+(i+1),name:f[1],level:f[2],ready:false,team:TEAM?2:0,kind:'friend'})});
 S.room={privacy:'private',code:JOIN||Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rand(0,31)]).join(''),players:P};
 /* ponsel lokal / bot otomatis Ready; host harus menekan READY sendiri */
 P.forEach(p=>{if(p.kind==='bot'||p.kind==='local')p.ready=true});
 $('#rt').textContent=MODE==='vsc'?'VS COMPUTER':MODE==='local'?'MULTI PLAYER':(TEAM?'ROOM TEAM':'ROOM SOLO');
 $('#rs').textContent=(MAP?MAP.name.replace(/^Map /,''):'-')+' • '+COUNT+' pemain';
 $('#invB').hidden=!(ONLINE&&HOST);$('#hbar').hidden=!(ONLINE&&HOST);$('#cCode').textContent=S.room.code;
 if(ONLINE&&!HOST)guestSim();
}
/* ---------- POWER SHOP ---------- */
const full=()=>PW.equipped.length>=5;
function renderPower(){
 $('#coins').textContent=fmt(PD.coins());$('#slotN').textContent=PW.equipped.length+'/5';
 $('#pips').innerHTML=[0,1,2,3,4].map(i=>`<i class="${i<PW.equipped.length?'on':''}"></i>`).join('');$('#pnote').hidden=!full();
 $('#plist').innerHTML=POWERS.map(p=>{const own=PW.owned.includes(p.id),eq=PW.equipped.includes(p.id),pr=POWER_PRICE[p.id]||0;let b;
  if(eq)b=`<button class="bt r" data-a="un" data-id="${p.id}">LEPAS</button>`;
  else if(own)b=`<button class="bt b" data-a="eq" data-id="${p.id}" ${full()?'disabled':''}>PASANG</button>`;
  else b=`<button class="bt y" data-a="buy" data-id="${p.id}" ${full()||PD.coins()<pr?'disabled':''}>BELI</button>`;
  return `<div class="pr ${eq?'eq':''}"><img src="${p.icon}" alt="" draggable="false"><div class="t"><b>${esc(p.name)}</b><small>${own?(eq?'✓ Dipakai':'✓ Dimiliki'):'🪙 '+pr}${full()&&!own?' • slot penuh':PD.coins()<pr&&!own?' • koin kurang':''}</small></div>${b}</div>`}).join('');
}
$('#plist').onclick=e=>{const b=e.target.closest('button[data-a]');if(!b||b.disabled)return;const id=b.dataset.id,a=b.dataset.a,pr=POWER_PRICE[id]||0;
 if(a==='un')PW.equipped=PW.equipped.filter(x=>x!==id);
 else if(a==='eq'){if(full())return;PW.equipped.push(id)}
 else{if(full())return toast('Slot penuh — lepas satu Power dulu');const r=PD.addCurrency(-pr,0);if(!r.ok)return toast('Koin tidak cukup');PW.owned.push(id);PW.equipped.push(id);toast((IC.byId(id).name)+' dibeli & dipasang')}
 saveP();renderPower();renderBottom()};
/* ---------- KARAKTER 3D (UT.CharacterView = model asli, tidak diubah) ---------- */
let R,SC,CAM,CH,ang=-.5,drag=null;
function init3D(){
 if(typeof THREE==='undefined'||!UT.CharacterView){$('#stg').insertAdjacentHTML('beforeend','<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:1.8rem">3D tidak tersedia</div>');return}
 R=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));
 SC=new THREE.Scene();CAM=new THREE.PerspectiveCamera(32,1,.1,100);CAM.position.set(0,.4,9);CAM.lookAt(0,0,0);
 SC.add(new THREE.AmbientLight(0xffffff,.8));const d=new THREE.DirectionalLight(0xffe6b0,.9);d.position.set(4,8,6);SC.add(d);
 const st=$('#stg');const fit=()=>{const w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;R.setSize(w,h,false);CAM.aspect=w/h;CAM.updateProjectionMatrix()};
 new ResizeObserver(fit).observe(st);fit();
 st.addEventListener('pointerdown',e=>{drag={x:e.clientX,a:ang};try{st.setPointerCapture(e.pointerId)}catch(_){}});
 st.addEventListener('pointermove',e=>{if(drag)ang=drag.a+(e.clientX-drag.x)*.012});
 ['pointerup','pointercancel'].forEach(v=>st.addEventListener(v,()=>drag=null));
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function loop(t){requestAnimationFrame(loop);if(!CH)return;if(!drag&&!reduce)ang+=.008;CH.rotation.y=ang;try{CH.userData.anim&&CH.userData.anim(t/1000)}catch(e){}R.render(SC,CAM)})(0);
}
function showChar(){
 if(!SC)return;const it=eqItem('skin');if(CH)SC.remove(CH);
 CH=UT.CharacterView.make(THREE,it?it.gameKey:'steve','idle');
 const bb=new THREE.Box3().setFromObject(CH),sz=bb.getSize(new THREE.Vector3()),c=bb.getCenter(new THREE.Vector3()),k=4.2/(sz.y||1);
 CH.scale.multiplyScalar(k);CH.position.set(-c.x*k,-c.y*k,-c.z*k);
 const w=new THREE.Group();w.add(CH);CH=w;SC.add(CH);
}
function renderLook(){
 const f=eqItem('frame'),d=eqItem('dice');
 $('#pvf').innerHTML=f?`<span class="im"><img src="${f.image}" alt="" draggable="false"></span><span>${esc(f.name)}</span>`:'';
 $('#pvd').innerHTML=d?`<span class="im">${ItemArt.dice(d.id)}</span><span>${esc(d.name)}</span>`:'';
}
const CUST={skin:'SKIN',frame:'FRAME',dice:'DICE'};
function renderCust(){
 $('#tabs').innerHTML=Object.keys(CUST).map(k=>`<button class="tab ${S.cust===k?'on':''}" data-k="${k}"><b>${CUST[k]}</b><small>CHANGE</small></button>`).join('');
 const art=it=>it.kind==='skin'?ItemArt.character(it.id):it.kind==='frame'?`<img src="${it.image}" alt="" draggable="false">`:ItemArt.dice(it.id);
 const own=IC.items.filter(i=>i.kind===S.cust&&PD.owns(i.id));
 $('#opts').innerHTML=own.map(it=>`<button class="op ${PD.equippedId(S.cust)===it.id?'sel':''}" data-id="${it.id}" aria-label="${esc(it.name)}"><span>${art(it)}</span><span>${esc(it.name.replace(/^(Frame|Dadu) /,''))}</span></button>`).join('');
}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-k]');if(b){S.cust=b.dataset.k;renderCust()}};
$('#opts').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;const r=PD.equip(b.dataset.id);if(!r.ok)return toast('Tidak bisa dipasang');renderCust();renderLook();if(S.cust==='skin')showChar()};
/* ---------- PLAYER LIST ---------- */
const pending=()=>Object.keys(S.invites).length,slotsLeft=()=>COUNT-S.room.players.length-pending();
const me=()=>S.room.players.find(p=>p.id==='me');
function avatar(p){return p.kind==='bot'?'<span class="av"><img src="assets/Images/icon/mode/robot.webp" alt="" draggable="false"></span>':`<span class="av">${esc(p.name[0]||'?').toUpperCase()}</span>`}
function prow(p){const kind={host:'Host',friend:'Teman',bot:'Computer',local:'Lokal'}[p.kind],mv=(TEAM&&HOST)?`<button class="mv" data-mv="${p.id}" aria-label="Pindah tim">⇄</button>`:'';
 return `<div class="pp ${p.id==='me'?'me':''}">${avatar(p)}<div class="pi"><b>${esc(p.name)}${p.kind==='host'?'<span class="tg">HOST</span>':''}</b><small>Lv ${p.level} • ${kind}</small></div>${mv}<span class="st ${p.ready?'rd':'wt'}">${p.ready?'READY':'WAITING'}</span></div>`}
function srow(team){if(!ONLINE)return'';const lock=S.room.privacy==='private';
 if(!HOST)return `<div class="sl st0"><span>${lock?'🔒':'🔓'}</span><span>Slot kosong</span></div>`;
 return `<button class="sl" data-inv="${team||0}"><span>＋</span><span>${lock?'Khusus undangan':'Terbuka untuk umum'}<small>Ketuk untuk undang teman</small></span></button>`}
function trow(p){const kind={host:'Host',friend:'Teman',bot:'Computer',local:'Lokal'}[p.kind],mv=(TEAM&&HOST)?`<button class="mv" data-mv="${p.id}" aria-label="Pindah tim">⇄</button>`:'';
 return `<div class="tr t${p.team} ${p.ready?'rd':''} ${p.id==='me'?'me':''}"><span class="bd">${p.ready?'READY':'WAITING'}</span>${avatar(p)}<div class="pi"><b>${esc(p.name)}${p.kind==='host'?'<span class="tg">HOST</span>':''}</b><small>Lv ${p.level} • ${kind}</small></div>${mv}</div>`}
function tslot(team){const lock=S.room.privacy==='private',ic=lock?'🔒':'🔓';
 if(!HOST)return `<div class="tr sl t${team}"><span class="bd">${ic}</span><div class="pi"><b>Slot kosong</b></div></div>`;
 return `<button class="tr sl t${team}" data-inv="${team}"><span class="bd">${ic}</span><div class="pi"><b>Slot kosong</b><small>${lock?'Khusus undangan':'Terbuka untuk umum'}</small></div><span class="add">＋ UNDANG</span></button>`}
function renderPlayers(){
 const r=S.room,P=r.players;$('#cnt').textContent=P.length+'/'+COUNT;$('#sPriv').classList.toggle('on',r.privacy==='private');$('#sPub').classList.toggle('on',r.privacy==='public');
 let h='';
 if(TEAM)[1,2].forEach(t=>{const tp=P.filter(p=>p.team===t);h+=`<div class="th t${t}"><span>TEAM ${t}</span><span>${tp.length}/2</span></div>`+tp.map(trow).join('');for(let i=tp.length;i<2;i++)h+=tslot(t)});
 else{h=P.map(prow).join('');for(let i=P.length;i<COUNT;i++)h+=srow(0)}
 if(ONLINE&&pending())h+=`<div class="note">⏳ ${pending()} undangan menunggu respons</div>`;
 $('#pl').classList.toggle('tm',TEAM);$('#plr').innerHTML=h;if($('#inv').classList.contains('show'))renderInvite();
}
$('#plr').onclick=e=>{const m=e.target.closest('[data-mv]'),s=e.target.closest('[data-inv]');if(m)moveTeam(m.dataset.mv);else if(s)openInvite(+s.dataset.inv)};
$('#sPriv').onclick=()=>{if(HOST){S.room.privacy='private';renderPlayers()}};$('#sPub').onclick=()=>{if(HOST){S.room.privacy='public';renderPlayers()}};
function copy(t){const v=t==='code'?S.room.code:`${location.origin}${location.pathname}?mode=online&format=${FORMAT}&count=${COUNT}&role=guest&code=${S.room.code}`;
 try{navigator.clipboard.writeText(v).then(()=>toast(t==='code'?'Kode disalin':'Link disalin'),()=>toast('Kode: '+S.room.code))}catch(e){toast('Kode: '+S.room.code)}}
$('#cCode').onclick=()=>HOST&&copy('code');$('#cLink').onclick=()=>HOST&&copy('link');
function moveTeam(id){if(!HOST)return;const p=S.room.players.find(x=>x.id===id),t=p.team===1?2:1;if(S.room.players.filter(x=>x.team===t).length>=2)return toast('Team '+t+' sudah penuh');p.team=t;renderPlayers();renderBottom()}
/* ---------- READY / START (START hanya host) ---------- */
function check(){const P=S.room.players;
 if(ONLINE){if(TEAM){if(P.length<4)return{ok:false,msg:`Butuh ${4-P.length} pemain lagi untuk 2 vs 2`};if(P.filter(p=>p.team===1).length!==2)return{ok:false,msg:'Atur tim menjadi 2 vs 2'}}else if(P.length<2)return{ok:false,msg:'Butuh minimal 2 pemain'}}
 if(!me().ready)return{ok:false,msg:'Tekan READY untuk bersiap'};
 const n=P.filter(p=>!p.ready).length;if(n)return{ok:false,msg:`Menunggu ${n} pemain Ready`};
 return{ok:true,msg:HOST?'Semua siap — tekan START GAME!':'Menunggu host memulai'}}
function renderBottom(){const c=check(),h=me();$('#sttx').textContent=(c.ok?'✅ ':'⏳ ')+c.msg;
 const rb=$('#rdy');rb.textContent=h.ready?'✓ READY • BATAL':'✓ READY';rb.classList.toggle('on',!h.ready);rb.classList.toggle('go',h.ready);
 $('#start').hidden=!HOST;$('#start').disabled=!c.ok;
 if(!HOST){ /* SIMULASI: host menekan START — ganti dengan event dari server */
  if(c.ok&&!S.hostT)S.hostT=setTimeout(()=>{toast('Host memulai permainan');launch()},2000);else if(!c.ok&&S.hostT){clearTimeout(S.hostT);S.hostT=null}}}
$('#rdy').onclick=()=>{const h=me();h.ready=!h.ready;renderPlayers();renderBottom()};
function cfg(){const sk=eqItem('skin'),fr=eqItem('frame'),di=eqItem('dice');
 return{type:'room',mode:MODE,format:FORMAT,privacy:S.room.privacy,host:HOST,code:S.room.code,map:MAP&&MAP.gameKey,
  players:S.room.players.map(p=>({name:p.name,team:p.team,kind:p.kind})),powers:PW.equipped.slice(),
  skin:sk&&sk.gameKey,frame:fr&&fr.gameKey,dice:di&&di.gameKey}}
function launch(){clearT();RF.launch(cfg())}
function startGame(){if(!HOST||!check().ok)return;launch()}   /* server: validasi ulang host + syarat saat backend tersedia */
$('#start').onclick=startGame;
function guestSim(){const P=S.room.players,rd=(id,ms)=>S.timers.push(setTimeout(()=>{const p=P.find(x=>x.id===id);if(p){p.ready=true;renderPlayers();renderBottom()}},ms));rd('host',rand(1200,2400));rd('f_g2',rand(2000,3500));rd('f_g3',rand(2500,4000))}
/* ---------- INVITE (hanya Create Room) ---------- */
function openInvite(team){if(!ONLINE||!HOST)return;S.invTeam=team||0;renderInvite();$('#inv').classList.add('show')}
const closeInvite=()=>$('#inv').classList.remove('show');
$('#invB').onclick=()=>openInvite(0);$('#invX').onclick=closeInvite;$('#inv').onclick=e=>{if(e.target.id==='inv')closeInvite()};
$('#tLine').onclick=()=>{S.invTab='line';renderInvite()};$('#tGame').onclick=()=>{S.invTab='game';renderInvite()};
function renderInvite(){const r=S.room,left=slotsLeft();
 $('#tLine').classList.toggle('on',S.invTab==='line');$('#tGame').classList.toggle('on',S.invTab==='game');
 $('#slotInfo').textContent=`Pemain ${r.players.length}/${COUNT} • Slot tersedia: ${Math.max(0,left)}${pending()?' • '+pending()+' menunggu':''}`;
 $('#fl').innerHTML=FRIENDS.filter(f=>f.src===S.invTab).map(f=>{const inR=r.players.some(p=>p.fid===f.id),pe=S.invites[f.id];let b,s;
  if(inR){b='<button class="bt" disabled>DI ROOM</button>';s='<small class="on_">● Sudah di room</small>'}
  else if(!f.online){b='<button class="bt" disabled>OFFLINE</button>';s='<small class="off_">○ Offline</small>'}
  else if(pe){b=`<button class="bt r" data-c="${f.id}">WAITING ✕</button>`;s='<small class="wt_">⏳ Menunggu respons</small>'}
  else if(left<=0){b='<button class="bt" disabled>PENUH</button>';s='<small class="on_">● Online</small>'}
  else{b=`<button class="bt" data-i="${f.id}">INVITE</button>`;s='<small class="on_">● Online</small>'}
  return `<div class="fr"><span class="av">${esc(f.name[0])}</span><div class="pi"><b>${esc(f.name)}</b>${s}</div>${b}</div>`}).join('')}
$('#fl').onclick=e=>{const i=e.target.closest('[data-i]'),c=e.target.closest('[data-c]');if(i)invite(i.dataset.i);else if(c)cancelInv(c.dataset.c)};
/* SIMULASI undangan: ganti dengan server (kirim invite, terima respons, sinkron slot/tim) */
function invite(id){const f=FRIENDS.find(x=>x.id===id),r=S.room;if(!HOST||!f.online||S.invites[id]||r.players.some(p=>p.fid===id)||slotsLeft()<=0)return;
 const team=S.invTeam||0;S.invites[id]={team,timer:setTimeout(()=>{delete S.invites[id];accept(f,team)},rand(1800,4000))};renderPlayers();toast('Undangan dikirim ke '+f.name)}
function cancelInv(id){const v=S.invites[id];if(!v)return;clearTimeout(v.timer);delete S.invites[id];renderPlayers()}
function accept(f,pref){const r=S.room;if(r.players.length>=COUNT)return;let team=0;
 if(TEAM){const c=t=>r.players.filter(p=>p.team===t).length;team=[pref,1,2].find(t=>t&&c(t)<2)||1}
 const p={id:'f_'+f.id,fid:f.id,name:f.name,level:f.level,ready:false,team,kind:'friend'};r.players.push(p);toast(f.name+' bergabung');
 S.timers.push(setTimeout(()=>{if(r.players.includes(p)){p.ready=true;renderPlayers();renderBottom()}},rand(2000,4000)));renderPlayers();renderBottom()}
addEventListener('keydown',e=>{if(e.key==='Escape')closeInvite()});
addEventListener('pagehide',clearT);
/* ---------- init ---------- */
setup();renderPower();renderCust();renderLook();renderPlayers();renderBottom();init3D();showChar();
document.documentElement.classList.add('ut-ready');
})();
</script>
</body></html>
